# Builds the app and puts it on GitHub Pages at https://shjiex.github.io/apt-studio/
# every time main changes. It can also be started by hand from the Actions tab.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the site sits under /apt-studio/, so every address in the build starts with that
      - run: npx vite build --base=/apt-studio/
      # GitHub Pages serves 404.html for an address it has no file for, such as
      # /apt-studio/login. A copy of the app there lets the app's own router show the page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
